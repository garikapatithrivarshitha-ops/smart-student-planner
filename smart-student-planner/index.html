<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Student Planner</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

<!-- Sidebar Overlay (mobile) -->
<div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

<div class="app-layout">

  <!-- ===== SIDEBAR ===== -->
  <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">

    <div class="sidebar-header">
      <!-- Logo -->
      <div class="sidebar-logo">
        <div class="logo-icon" aria-hidden="true">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="logo-text">
          Smart Student
          <span>Planner</span>
        </div>
      </div>

      <!-- User info -->
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebar-avatar" aria-hidden="true">S</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-user-name">Student</div>
          <div class="user-role">Student</div>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav" aria-label="Application sections">
      <div class="nav-label">Main Menu</div>

      <div class="nav-item active" data-section="dashboard" role="button" tabindex="0" aria-label="Dashboard">
        <i class="fa-solid fa-house" aria-hidden="true"></i>
        <span>Dashboard</span>
      </div>

      <div class="nav-item" data-section="tasks" role="button" tabindex="0" aria-label="My Tasks">
        <i class="fa-solid fa-list-check" aria-hidden="true"></i>
        <span>My Tasks</span>
        <span class="nav-badge" id="badge-tasks" style="display:none;">0</span>
      </div>

      <div class="nav-item" data-section="timetable" role="button" tabindex="0" aria-label="Timetable">
        <i class="fa-solid fa-clock" aria-hidden="true"></i>
        <span>Timetable</span>
      </div>

      <div class="nav-item" data-section="assignments" role="button" tabindex="0" aria-label="Assignments">
        <i class="fa-solid fa-file-lines" aria-hidden="true"></i>
        <span>Assignments</span>
        <span class="nav-badge" id="badge-assignments" style="display:none;">0</span>
      </div>

      <div class="nav-item" data-section="calendar" role="button" tabindex="0" aria-label="Exam Calendar">
        <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
        <span>Exam Calendar</span>
      </div>

      <div class="nav-item" data-section="progress" role="button" tabindex="0" aria-label="Study Progress">
        <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
        <span>Study Progress</span>
      </div>

      <div class="nav-label" style="margin-top: var(--spacing-md);">Account</div>

      <div class="nav-item" data-section="settings" role="button" tabindex="0" aria-label="Profile and Settings">
        <i class="fa-solid fa-gear" aria-hidden="true"></i>
        <span>Profile & Settings</span>
      </div>
    </nav>

    <!-- Logout -->
    <div class="sidebar-footer">
      <button class="btn-logout logout-btn" type="button" aria-label="Logout">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        <span>Logout</span>
      </button>
    </div>

  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-content" id="main-content">

    <!-- Topbar -->
    <header class="topbar" role="banner">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="false">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <h1 class="page-title" id="page-title">Dashboard</h1>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date" aria-label="Current date"></span>
        <button class="topbar-btn logout-btn" title="Logout" aria-label="Logout">
          <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <div class="page-content">

      <!-- ===== DASHBOARD SECTION ===== -->
      <section id="section-dashboard" class="section active" aria-label="Dashboard">
        <!-- Rendered by dashboard.js -->
        <div id="dashboard-content"></div>
      </section>

      <!-- ===== TASKS SECTION ===== -->
      <section id="section-tasks" class="section" aria-label="My Tasks">
        <div id="tasks-content"></div>
      </section>

      <!-- ===== TIMETABLE SECTION ===== -->
      <section id="section-timetable" class="section" aria-label="Study Timetable">
        <div id="timetable-content"></div>
      </section>

      <!-- ===== ASSIGNMENTS SECTION ===== -->
      <section id="section-assignments" class="section" aria-label="Assignments">
        <div id="assignments-content"></div>
      </section>

      <!-- ===== CALENDAR SECTION ===== -->
      <section id="section-calendar" class="section" aria-label="Exam Calendar">
        <div id="calendar-content"></div>
      </section>

      <!-- ===== PROGRESS SECTION ===== -->
      <section id="section-progress" class="section" aria-label="Study Progress">
        <div id="progress-content"></div>
      </section>

      <!-- ===== SETTINGS SECTION ===== -->
      <section id="section-settings" class="section" aria-label="Profile and Settings">
        <div id="settings-content"></div>
      </section>

    </div><!-- end .page-content -->
  </main>

</div><!-- end .app-layout -->

<!-- Toast Container -->
<div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

<!-- ===== SCRIPTS ===== -->
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/tasks.js"></script>
<script src="js/timetable.js"></script>
<script src="js/assignments.js"></script>
<script src="js/calendar.js"></script>
<script src="js/progress.js"></script>
<script src="js/settings.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // ── 1. Initialize section modules (registers window.open* helpers) ──
    initDashboard();
    initTasks();
    initTimetable();
    initAssignments();
    initCalendar();
    initProgress();
    initSettings();

    // ── 2. Register the sectionActivated listener BEFORE initApp fires navigateTo ──
    document.addEventListener('sectionActivated', e => {
      const { section } = e.detail;
      switch (section) {
        case 'dashboard':    renderDashboard();    break;
        case 'tasks':        renderTasks();        break;
        case 'timetable':    renderTimetable();    break;
        case 'assignments':  renderAssignments();  break;
        case 'calendar':     renderCalendar();     break;
        case 'progress':     renderProgress();     break;
        case 'settings':     renderSettings();     break;
      }
      updateSidebarBadges();
    });

    // ── 3. Now init the app (applies theme, checks auth, calls navigateTo) ──
    initApp();

    // ── 4. Keyboard nav for sidebar items ──
    document.querySelectorAll('.nav-item[data-section]').forEach(item => {
      item.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          item.click();
        }
      });
    });
  });
</script>

</body>
</html>
